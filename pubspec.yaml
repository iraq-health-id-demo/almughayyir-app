name: mughayyir
description: "المُغير - تطبيق لتنظيم حجوزات الأطباء في العيادات الخاصة."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# توليد أيقونات التطبيق لأندرويد و iOS:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#5B2FC9"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
